[project]
name = "pymergetic-wasmmod-tools"
dynamic = ["version"]
description = "Host-side wasmmod tooling: ELF helpers and pack inspect"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Rouven Raudzus", email = "raudzus@pymergetic.com" }]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.8.0",
]

[project.urls]
Homepage = "https://github.com/pymergetic/wasmmod-tools"
Documentation = "https://github.com/pymergetic/wasmmod-tools#readme"

[project.scripts]
wasmmod-inspect = "pymergetic.wasmmod.tools.inspect:main"

[build-system]
requires = ["setuptools>=68", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["pymergetic*"]
namespaces = true

[tool.setuptools.package-data]
"pymergetic.wasmmod.tools" = ["py.typed"]

[tool.setuptools_scm]
root = "."
search_parent_directories = false
version_file = "src/pymergetic/wasmmod/tools/_version.py"
fallback_version = "0.1.0a1"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["*.md"]

[tool.ruff.lint]
ignore = ["BLE001"]
