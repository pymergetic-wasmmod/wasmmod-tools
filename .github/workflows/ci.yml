name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
      - name: Ruff
        run: ruff check src tests
      - name: Pytest (unit)
        run: pytest -q tests/test_wasmmod_cdn.py tests/test_wasmmod_publish.py tests/test_wasmmod_elf.py
      - name: CLI smoke
        run: wasmmod --help && python -c "from pymergetic.wasmmod.tools import elf, inspect; print(elf.__name__)"
